<!-- ════════ OPENING HOURS & MAP STRIP ════════ -->
<style>
  .oh-strip {
    position: relative; background: var(--lt-navy); padding: 4.5rem 0;
    overflow: hidden; font-family: 'DM Sans', sans-serif;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .oh-strip::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(184,132,26,0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(184,132,26,0.03) 0%, transparent 60%);
  }
  .oh-strip .container { position: relative; z-index: 2; }
  .oh-heading {
    display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;
  }
  .oh-heading .bar { width: 4px; height: 28px; background: #e74c3c; border-radius: 2px; }
  .oh-heading h2 {
    font-size: 1.1rem; font-weight: 800; color: #fff;
    letter-spacing: 3px; text-transform: uppercase; margin: 0;
  }
  .oh-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
  .oh-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.85rem 0; border-bottom: 1px solid rgba(255,255,255,0.07);
    transition: background 0.25s;
  }
  .oh-row:last-child { border-bottom: none; }
  .oh-row:hover { background: rgba(255,255,255,0.02); }
  .oh-day {
    display: flex; align-items: center; gap: 0.65rem;
    color: #fff; font-weight: 600; font-size: 0.88rem;
  }
  .oh-day .bi-clock { font-size: 0.95rem; color: #e74c3c; }
  .oh-time {
    font-size: 0.88rem; color: rgba(255,255,255,0.65);
    font-weight: 400; letter-spacing: 0.5px;
  }
  .oh-row.closed .oh-day { color: rgba(255,255,255,0.3); }
  .oh-row.closed .oh-day .bi-clock { color: rgba(255,255,255,0.2); }
  .oh-row.closed .oh-time { color: rgba(255,255,255,0.25); }

  .oh-info-icon {
    width: 50px; height: 50px; border: 2px solid var(--lt-gold); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; color: var(--lt-gold); margin-bottom: 1rem;
  }
  .oh-info h3 { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
  .oh-info p { font-size: 0.84rem; color: rgba(255,255,255,0.5); line-height: 1.7; margin: 0; }

  .oh-map-wrap {
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    overflow: hidden; margin-top: 1.5rem;
  }

  @media (max-width: 767px) {
    .oh-strip { padding: 3rem 0; }
  }
</style>

<section class="oh-strip">
  <div class="container">
    <div class="row g-5 align-items-start">
      <!-- Left: Schedule -->
      <div class="col-lg-5">
        <div class="oh-heading">
          <span class="bar"></span>
          <h2>Opening Hours</h2>
        </div>
        <div class="oh-grid">
          <div class="oh-row"><div class="oh-day"><i class="bi bi-clock"></i> Monday</div><div class="oh-time">09.00 – 17.00</div></div>
          <div class="oh-row"><div class="oh-day"><i class="bi bi-clock"></i> Tuesday</div><div class="oh-time">09.00 – 17.00</div></div>
          <div class="oh-row"><div class="oh-day"><i class="bi bi-clock"></i> Wednesday</div><div class="oh-time">09.00 – 17.00</div></div>
          <div class="oh-row"><div class="oh-day"><i class="bi bi-clock"></i> Thursday</div><div class="oh-time">09.00 – 17.00</div></div>
          <div class="oh-row"><div class="oh-day"><i class="bi bi-clock"></i> Friday</div><div class="oh-time">09.00 – 17.00</div></div>
          <div class="oh-row closed"><div class="oh-day"><i class="bi bi-clock"></i> Saturday & Sunday</div><div class="oh-time">Closed</div></div>
        </div>
      </div>
      <!-- Right: Google Map -->
      <div class="col-lg-7">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:2rem">
          <span class="bar"></span>
          <h2 style="font-size:1.1rem;font-weight:800;color:#fff;letter-spacing:3px;text-transform:uppercase;margin:0">Find Us</h2>
        </div>
        <div class="oh-map-wrap" style="margin-top:0;position:relative">
          <div class="ratio ratio-16x9">
            <iframe src="https://maps.google.com/maps?q=22+Dewala+Rd,+Nugegoda,+Sri+Lanka&t=&z=16&ie=UTF8&iwloc=B&output=embed"
                    style="border:0;width:100%;height:100%" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <a href="https://maps.app.goo.gl/BUgXqCxpJ8fqZf2N7" target="_blank" rel="noopener noreferrer"
             style="position:absolute;inset:0;z-index:10;display:block;cursor:pointer" title="Open in Google Maps"></a>
        </div>
        {% if settings and settings.address %}
        <div style="margin-top:1rem;display:flex;align-items:center;gap:0.75rem">
          <i class="bi bi-geo-alt-fill" style="color:var(--lt-gold);font-size:1.1rem"></i>
          <span style="color:rgba(255,255,255,0.6);font-size:0.84rem;line-height:1.5">{{ settings.address }}</span>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</section>
